name: Deploy to GitHub Pages

on:
  push:
    branches: [managed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agentbase-react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agentbase-react-demo

      - name: Build
        run: npm run build
        working-directory: agentbase-react-demo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: agentbase-react-demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
